<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 690" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', 'Pretendard', sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="ar-rec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0ea5e9"/>
    </marker>
    <marker id="ar-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1500" height="690" fill="#fbfcfd"/>

  <!-- Title -->
  <text x="60" y="56"><tspan font-size="26" font-weight="700" fill="#0f172a">OpenGateway — 엔진과 백오피스의 분리</tspan><tspan font-size="14" fill="#64748b" dx="16">Data Plane 은 모델 호출에, Control Plane 은 정책 · 과금 · 관리에 집중</tspan></text>

  <!-- Client -->
  <g>
    <rect x="60" y="94" width="1380" height="56" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
    <text x="84" y="128" font-size="16" font-weight="600" fill="#1e293b">Client</text>
    <text x="172" y="128" font-size="13" fill="#475569">OpenAI 호환 SDK · cURL — model 만 바꿔 10+ Provider · 100+ 모델 사용</text>
  </g>

  <!-- Data Plane -->
  <g>
    <rect x="60" y="180" width="640" height="480" rx="14" fill="#ffffff" stroke="#0e7490" stroke-width="1.8"/>
    <text x="84" y="218" font-size="24" font-weight="700" fill="#0e7490">Data Plane — 엔진</text>
    <text x="84" y="242" font-size="13" fill="#155e75">요청을 받아 모델로 라우팅 · 응답 정규화 · 호출 기록</text>

    <!-- Facade -->
    <g>
      <rect x="84" y="260" width="592" height="76" rx="10" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.3"/>
      <text x="104" y="288" font-size="18" font-weight="700" fill="#0e7490">Facade</text>
      <text x="104" y="314" font-size="13" fill="#1f2937">전체 흐름 제어 · 모델 폴백 · 모델 호출 이력 배치 송출</text>
    </g>

    <!-- SmartRouter -->
    <g>
      <rect x="84" y="348" width="592" height="76" rx="10" fill="#f0fdf4" stroke="#10b981" stroke-width="1.3"/>
      <text x="104" y="376" font-size="18" font-weight="700" fill="#047857">SmartRouter</text>
      <text x="104" y="402" font-size="13" fill="#1f2937">대상 모델 동적 선정 · Factor 체인으로 증류 · 인터페이스로 확장</text>
    </g>

    <!-- ModelService -->
    <g>
      <rect x="84" y="436" width="592" height="76" rx="10" fill="#faf5ff" stroke="#a855f7" stroke-width="1.2"/>
      <text x="104" y="464" font-size="18" font-weight="700" fill="#6b21a8">ModelService — Provider 모듈</text>
      <text x="104" y="490" font-size="13" fill="#1f2937">Provider 별 Mapper · Client · StreamMapper 를 모듈로 격리</text>
    </g>

    <!-- Providers -->
    <g>
      <rect x="84" y="524" width="592" height="118" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.2"/>
      <text x="104" y="552" font-size="16" font-weight="700" fill="#92400e">Model Providers</text>
      <text x="104" y="576" font-size="13" fill="#1f2937">OpenAI · Anthropic · Vertex AI · Azure OpenAI</text>
      <text x="104" y="596" font-size="13" fill="#1f2937">xAI · Kimi · DeepSeek · Z.ai · MiniMax · Clova Studio</text>
      <text x="104" y="618" font-size="13" fill="#1f2937">Airgap (vLLM passthrough)</text>
    </g>
  </g>

  <!-- Control Plane -->
  <g>
    <rect x="860" y="180" width="580" height="480" rx="14" fill="#ffffff" stroke="#7c2d12" stroke-width="1.8"/>
    <text x="884" y="218" font-size="24" font-weight="700" fill="#7c2d12">Control Plane — 매니저 + 백오피스</text>
    <text x="884" y="242" font-size="13" fill="#9a3412">정책 · 계정 · 과금 · 관측 · 관리 화면</text>

    <g>
      <rect x="884" y="260" width="532" height="86" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="1.1"/>
      <text x="904" y="288" font-size="17" font-weight="700" fill="#7c2d12">Account · API Key · Authn</text>
      <text x="904" y="316" font-size="13" fill="#1f2937">사용자 · 팀 · API Key 발급 / 회수</text>
      <text x="904" y="336" font-size="13" fill="#1f2937">Data Plane 캐시 evict 푸시로 즉시 무효화</text>
    </g>

    <g>
      <rect x="884" y="358" width="532" height="86" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="1.1"/>
      <text x="904" y="386" font-size="17" font-weight="700" fill="#7c2d12">Billing · Pricing · Redeem</text>
      <text x="904" y="414" font-size="13" fill="#1f2937">모델 단가 · Stripe · PayPal 결제 · Redeem Code</text>
      <text x="904" y="434" font-size="13" fill="#1f2937">모델 호출 이력 받아 과금으로 변환</text>
    </g>

    <g>
      <rect x="884" y="456" width="532" height="86" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="1.1"/>
      <text x="904" y="484" font-size="17" font-weight="700" fill="#7c2d12">Logs · Usage · Observability</text>
      <text x="904" y="512" font-size="13" fill="#1f2937">모델 호출 이력 single source — Logs / Usage</text>
      <text x="904" y="532" font-size="13" fill="#1f2937">Grafana: 트래픽 · 비용 · Provider 분포</text>
    </g>

    <g>
      <rect x="884" y="554" width="532" height="86" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="1.1"/>
      <text x="904" y="582" font-size="17" font-weight="700" fill="#7c2d12">Admin · Frontend</text>
      <text x="904" y="610" font-size="13" fill="#1f2937">API Key / Logs / Usage / 결제 화면</text>
      <text x="904" y="630" font-size="13" fill="#1f2937">Auth0 · Stripe · PayPal · Vercel 배포</text>
    </g>
  </g>

  <!-- Client → Data Plane -->
  <line x1="380" y1="150" x2="380" y2="180" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- Interface arrows Data Plane ↔ Control Plane -->
  <line x1="702" y1="298" x2="858" y2="298" stroke="#475569" stroke-width="1.7" marker-end="url(#ar)" marker-start="url(#ar)"/>
  <text x="712" y="290" font-size="12" fill="#475569">API Key 검증 · evict</text>

  <line x1="702" y1="386" x2="858" y2="386" stroke="#0ea5e9" stroke-width="1.7" stroke-dasharray="6,4" marker-end="url(#ar-rec)"/>
  <text x="712" y="378" font-size="12" fill="#0369a1">모델 호출 이력 배치 송출</text>

</svg>
