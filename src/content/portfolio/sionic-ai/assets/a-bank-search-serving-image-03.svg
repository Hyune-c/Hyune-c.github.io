<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 880" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', 'Pretendard', sans-serif">
  <defs>
    <marker id="b-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="b-ar-up" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#10b981"/>
    </marker>
    <marker id="b-ar-dn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#06b6d4"/>
    </marker>
    <marker id="b-ar-trig" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>

    <symbol id="ico-clock" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <line x1="12" y1="12" x2="12" y2="6.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="12" y1="12" x2="16.5" y2="12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </symbol>
    <symbol id="ico-db" viewBox="0 0 24 24">
      <ellipse cx="12" cy="5" rx="8" ry="2.6" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <path d="M4 5 v14 c0 1.4 3.6 2.6 8 2.6 s8 -1.2 8 -2.6 v-14" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <path d="M4 12 c0 1.4 3.6 2.6 8 2.6 s8 -1.2 8 -2.6" fill="none" stroke="currentColor" stroke-width="1.8"/>
    </symbol>
    <symbol id="ico-sync" viewBox="0 0 24 24">
      <path d="M20 7 a 9 9 0 0 0 -16 1.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      <polyline points="20 2 20 7 15 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M4 17 a 9 9 0 0 0 16 -1.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      <polyline points="4 22 4 17 9 17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="ico-files" viewBox="0 0 24 24">
      <rect x="3" y="4" width="18" height="4.5" rx="1" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <rect x="3" y="10" width="18" height="4.5" rx="1" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <rect x="3" y="16" width="18" height="4.5" rx="1" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <circle cx="6.5" cy="6.25" r="0.7" fill="currentColor"/>
      <circle cx="6.5" cy="12.25" r="0.7" fill="currentColor"/>
      <circle cx="6.5" cy="18.25" r="0.7" fill="currentColor"/>
    </symbol>
    <symbol id="ico-server" viewBox="0 0 24 24">
      <rect x="3" y="3" width="18" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <rect x="3" y="14" width="18" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <circle cx="17.5" cy="6.5" r="0.9" fill="currentColor"/>
      <circle cx="17.5" cy="17.5" r="0.9" fill="currentColor"/>
      <line x1="6" y1="6.5" x2="12" y2="6.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="6" y1="17.5" x2="12" y2="17.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </symbol>
    <symbol id="ico-search" viewBox="0 0 24 24">
      <circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <line x1="15.2" y1="15.2" x2="20" y2="20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </symbol>
    <symbol id="ico-download" viewBox="0 0 24 24">
      <path d="M12 4 v 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      <polyline points="7 11 12 16 17 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="4" y1="20" x2="20" y2="20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </symbol>
    <symbol id="ico-upload" viewBox="0 0 24 24">
      <path d="M12 20 v -12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      <polyline points="7 13 12 8 17 13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="4" y1="4" x2="20" y2="4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </symbol>
    <symbol id="ico-memory" viewBox="0 0 24 24">
      <rect x="5" y="5" width="14" height="14" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <rect x="9" y="9" width="6" height="6" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <line x1="2" y1="9" x2="5" y2="9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="2" y1="15" x2="5" y2="15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="19" y1="9" x2="22" y2="9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="19" y1="15" x2="22" y2="15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="9" y1="2" x2="9" y2="5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="15" y1="2" x2="15" y2="5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="9" y1="19" x2="9" y2="22" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="15" y1="19" x2="15" y2="22" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </symbol>
    <symbol id="ico-check" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <polyline points="7.5 12.5 10.5 15.5 16.5 9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </defs>

  <rect width="1500" height="880" fill="#fbfcfd"/>

  <!-- Title -->
  <text x="60" y="56" font-size="24" font-weight="700" fill="#0f172a">A 은행 검색 데이터 서빙 — Indexer / Runner 책임 분리</text>

  <!-- 분리의 효과 (제목 아래 통합 박스) -->
  <g>
    <rect x="60" y="78" width="1380" height="84" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="80" y="106" font-size="13" fill="#334155">Indexer 가 Parquet 을 사전 생성하고, Runner 는 준비된 파일만 받아 적재하도록 분리</text>
    <text x="80" y="140" font-size="13" fill="#334155">기존 <tspan font-weight="700" fill="#b91c1c">3시간 30분</tspan>  →  개선 <tspan font-weight="700" fill="#047857">24분</tspan>  <tspan fill="#64748b">(88.6% 단축 · 8.8배 개선)</tspan></text>
  </g>

  <!-- Cronjob trigger (left) -->
  <g>
    <rect x="60" y="200" width="160" height="74" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.2"/>
    <g color="#6366f1"><use href="#ico-clock" x="76" y="216" width="20" height="20"/></g>
    <text x="104" y="232" font-size="14" font-weight="700" fill="#1e293b">Cronjob</text>
    <text x="140" y="256" text-anchor="middle" font-size="12" fill="#475569">Every 20min</text>
  </g>

  <!-- Qdrant (right) -->
  <g>
    <rect x="1240" y="200" width="200" height="120" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.3"/>
    <g color="#f59e0b"><use href="#ico-db" x="1258" y="216" width="22" height="22"/></g>
    <text x="1288" y="234" font-size="15" font-weight="700" fill="#92400e">Qdrant</text>
    <text x="1340" y="260" text-anchor="middle" font-size="12" fill="#1f2937">710만 벡터 · agent 별 collection</text>
    <text x="1340" y="280" text-anchor="middle" font-size="11.5" fill="#64748b">scroll · search · json export</text>
    <text x="1340" y="300" text-anchor="middle" font-size="11.5" fill="#64748b">5천 벡터당 ~15s</text>
  </g>

  <!-- Indexer Mode -->
  <g>
    <rect x="240" y="180" width="980" height="220" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/>
    <g color="#10b981"><use href="#ico-sync" x="258" y="194" width="26" height="26"/></g>
    <text x="292" y="215" font-size="20" font-weight="700" fill="#047857">Indexer Mode — 사전 처리</text>
    <text x="262" y="240" font-size="12.5" fill="#065f46">Qdrant 의 데이터 변화를 감지해 agent 별 Parquet 을 사전 생성 · 업로드</text>

    <g>
      <rect x="262" y="256" width="220" height="120" rx="9" fill="#ffffff" stroke="#6ee7b7"/>
      <g color="#10b981"><use href="#ico-search" x="276" y="270" width="16" height="16"/></g>
      <text x="298" y="283" font-size="14" font-weight="700" fill="#047857">① 변경 감지</text>
      <text x="282" y="308" font-size="12" fill="#1f2937">agent 별 metadata 조회</text>
      <text x="282" y="326" font-size="12" fill="#1f2937">documents · vectors hash 비교</text>
      <text x="282" y="348" font-size="11" fill="#64748b">변경 없으면 skip</text>
      <text x="282" y="366" font-size="11" fill="#64748b">git hash 도 함께 검증</text>
    </g>

    <g>
      <rect x="502" y="256" width="220" height="120" rx="9" fill="#ffffff" stroke="#6ee7b7"/>
      <g color="#10b981"><use href="#ico-db" x="516" y="270" width="16" height="16"/></g>
      <text x="538" y="283" font-size="14" font-weight="700" fill="#047857">② Qdrant 추출</text>
      <text x="522" y="308" font-size="12" fill="#1f2937">scroll · search · json export</text>
      <text x="522" y="328" font-size="12" fill="#1f2937">batch_size = 5,000</text>
      <text x="522" y="346" font-size="12" fill="#1f2937">semaphore_count = 20</text>
      <text x="522" y="366" font-size="11" fill="#64748b">QdrantLoader 병목 측정 반영</text>
    </g>

    <g>
      <rect x="742" y="256" width="220" height="120" rx="9" fill="#ffffff" stroke="#6ee7b7"/>
      <g color="#10b981"><use href="#ico-files" x="756" y="270" width="16" height="16"/></g>
      <text x="778" y="283" font-size="14" font-weight="700" fill="#047857">③ Parquet 생성</text>
      <text x="762" y="308" font-size="12" fill="#1f2937">agent 별 parquet 파일 작성</text>
      <text x="762" y="326" font-size="12" fill="#1f2937">메타데이터 함께 패키징</text>
      <text x="762" y="348" font-size="11" fill="#64748b">파일 저장 / 객체 생성</text>
      <text x="762" y="366" font-size="11" fill="#64748b">구간을 분리해 병목 관측</text>
    </g>

    <g>
      <rect x="982" y="256" width="220" height="120" rx="9" fill="#ffffff" stroke="#6ee7b7"/>
      <g color="#10b981"><use href="#ico-upload" x="996" y="270" width="16" height="16"/></g>
      <text x="1018" y="283" font-size="14" font-weight="700" fill="#047857">④ Storage 업로드</text>
      <text x="1002" y="308" font-size="12" fill="#1f2937">Parquet 파일 → Object Store</text>
      <text x="1002" y="326" font-size="12" fill="#1f2937">버전 metadata 갱신</text>
      <text x="1002" y="348" font-size="11" fill="#64748b">Runner 가 받아갈 source</text>
    </g>
  </g>

  <!-- Cronjob → Indexer -->
  <line x1="220" y1="237" x2="258" y2="237" stroke="#475569" stroke-width="1.6" marker-end="url(#b-ar)"/>

  <!-- Indexer ↔ Qdrant -->
  <line x1="1220" y1="280" x2="1238" y2="280" stroke="#10b981" stroke-width="1.5" marker-end="url(#b-ar-up)"/>
  <line x1="1238" y1="304" x2="1220" y2="304" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#b-ar)"/>

  <!-- Parquet Storage -->
  <g>
    <rect x="430" y="460" width="640" height="100" rx="12" fill="#faf5ff" stroke="#a855f7" stroke-width="1.5"/>
    <g color="#a855f7"><use href="#ico-files" x="466" y="476" width="28" height="28"/></g>
    <text x="510" y="496" font-size="18" font-weight="700" fill="#6b21a8">Parquet Storage</text>
    <text x="750" y="524" text-anchor="middle" font-size="12.5" fill="#1f2937">agent 별 Parquet 파일 + 버전 metadata — Indexer 와 Runner 의 연결 지점</text>
    <text x="750" y="544" text-anchor="middle" font-size="11.5" fill="#64748b">Runner 부트타임에 데이터를 만들지 않고, 이미 준비된 파일만 받아 메모리에 적재</text>
  </g>

  <!-- Indexer → Storage -->
  <line x1="750" y1="406" x2="750" y2="458" stroke="#10b981" stroke-width="1.8" marker-end="url(#b-ar-up)"/>
  <text x="760" y="436" font-size="12" fill="#047857">upload (사전 생성)</text>

  <!-- Storage → Runner -->
  <line x1="750" y1="562" x2="750" y2="614" stroke="#06b6d4" stroke-width="1.8" marker-end="url(#b-ar-dn)"/>
  <text x="760" y="592" font-size="12" fill="#0e7490">download (부트 시)</text>

  <!-- Control signal: Indexer 종료 → Runner 기동 호출 -->
  <path d="M 1092 376 L 1092 430 L 1460 430 L 1460 726 L 1442 726" fill="none" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#b-ar-trig)"/>
  <text x="1276" y="422" text-anchor="middle" font-size="11.5" font-weight="600" fill="#7c3aed">Indexer 종료 → Runner 기동 호출</text>

  <!-- Runner Mode -->
  <g>
    <rect x="60" y="616" width="1380" height="220" rx="14" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.6"/>
    <g color="#06b6d4"><use href="#ico-server" x="80" y="630" width="26" height="26"/></g>
    <text x="114" y="651" font-size="20" font-weight="700" fill="#0e7490">Runner Mode — 서빙</text>
    <text x="84" y="676" font-size="12.5" fill="#155e75">부트 시 Parquet 만 받아 메모리에 적재 · Qdrant 직접 접근 없이 즉시 서빙 준비</text>

    <g>
      <rect x="84" y="692" width="316" height="120" rx="9" fill="#ffffff" stroke="#67e8f9"/>
      <g color="#06b6d4"><use href="#ico-server" x="98" y="706" width="16" height="16"/></g>
      <text x="120" y="719" font-size="14" font-weight="700" fill="#0e7490">① 부트 시작</text>
      <text x="104" y="744" font-size="12" fill="#1f2937">runner 기동 신호 수신</text>
      <text x="104" y="762" font-size="12" fill="#1f2937">agent 별 metadata 조회</text>
      <text x="104" y="784" font-size="11" fill="#64748b">최신 Parquet 버전 확인</text>
    </g>

    <g>
      <rect x="420" y="692" width="316" height="120" rx="9" fill="#ffffff" stroke="#67e8f9"/>
      <g color="#06b6d4"><use href="#ico-download" x="434" y="706" width="16" height="16"/></g>
      <text x="456" y="719" font-size="14" font-weight="700" fill="#0e7490">② Parquet 다운로드</text>
      <text x="440" y="744" font-size="12" fill="#1f2937">Object Store → 로컬</text>
      <text x="440" y="762" font-size="12" fill="#1f2937">필요한 agent 파일만 선택</text>
      <text x="440" y="784" font-size="11" fill="#64748b">대량 데이터 변환 없음</text>
    </g>

    <g>
      <rect x="756" y="692" width="316" height="120" rx="9" fill="#ffffff" stroke="#67e8f9"/>
      <g color="#06b6d4"><use href="#ico-memory" x="770" y="706" width="16" height="16"/></g>
      <text x="792" y="719" font-size="14" font-weight="700" fill="#0e7490">③ 메모리 적재</text>
      <text x="776" y="744" font-size="12" fill="#1f2937">Parquet → BM25 · vector 인덱스</text>
      <text x="776" y="762" font-size="12" fill="#1f2937">CosineSimilarity 초기화</text>
      <text x="776" y="784" font-size="11" fill="#64748b">중복 초기화 / 실패 원인 제거</text>
    </g>

    <g>
      <rect x="1092" y="692" width="328" height="120" rx="9" fill="#ffffff" stroke="#67e8f9"/>
      <g color="#06b6d4"><use href="#ico-check" x="1106" y="706" width="16" height="16"/></g>
      <text x="1128" y="719" font-size="14" font-weight="700" fill="#0e7490">④ 서빙 준비 완료</text>
      <text x="1112" y="744" font-size="12" fill="#1f2937">검색 요청 처리 진입</text>
      <text x="1112" y="762" font-size="12" fill="#1f2937">장애 복구 시간 동일하게 단축</text>
      <text x="1112" y="784" font-size="11" fill="#64748b">Qdrant 직접 호출 없음</text>
    </g>
  </g>
</svg>
