<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 800" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', 'Pretendard', sans-serif">
  <defs>
    <marker id="f-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="f-ar-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#10b981"/>
    </marker>
    <marker id="f-ar-fail" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>

    <symbol id="ico-client" viewBox="0 0 24 24">
      <circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <path d="M4 21 a8 8 0 0 1 16 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </symbol>
    <symbol id="ico-flow" viewBox="0 0 24 24">
      <rect x="3" y="4" width="18" height="4" rx="1" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <rect x="3" y="10" width="18" height="4" rx="1" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <rect x="3" y="16" width="18" height="4" rx="1" fill="none" stroke="currentColor" stroke-width="1.8"/>
    </symbol>
    <symbol id="ico-credit" viewBox="0 0 24 24">
      <rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <line x1="3" y1="10" x2="21" y2="10" stroke="currentColor" stroke-width="1.8"/>
      <line x1="7" y1="15" x2="11" y2="15" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </symbol>
    <symbol id="ico-prep" viewBox="0 0 24 24">
      <path d="M5 5 h14 v6 a7 7 0 0 1 -14 0 z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M5 19 h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </symbol>
    <symbol id="ico-down" viewBox="0 0 24 24">
      <path d="M12 4 v12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      <polyline points="7 11 12 16 17 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="4" y1="20" x2="20" y2="20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </symbol>
    <symbol id="ico-brain" viewBox="0 0 24 24">
      <path d="M9 3 a3 3 0 0 0 -3 3 a3 3 0 0 0 -2.5 5 a3 3 0 0 0 1 5 a3 3 0 0 0 4.5 3.5 v-17 z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M15 3 a3 3 0 0 1 3 3 a3 3 0 0 1 2.5 5 a3 3 0 0 1 -1 5 a3 3 0 0 1 -4.5 3.5 v-17 z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
    </symbol>
    <symbol id="ico-save" viewBox="0 0 24 24">
      <path d="M5 3 h12 l4 4 v14 a0 0 0 0 1 0 0 h-16 a0 0 0 0 1 0 0 z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <rect x="8" y="14" width="8" height="6" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <line x1="9" y1="3" x2="9" y2="8" stroke="currentColor" stroke-width="1.6"/>
      <line x1="14" y1="3" x2="14" y2="8" stroke="currentColor" stroke-width="1.6"/>
    </symbol>
    <symbol id="ico-check" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <polyline points="7.5 12.5 10.5 15.5 16.5 9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="ico-cancel" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
      <line x1="8" y1="8" x2="16" y2="16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="16" y1="8" x2="8" y2="16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </symbol>
  </defs>

  <rect width="1500" height="800" fill="#fbfcfd"/>

  <!-- Title -->
  <text x="60" y="56" font-size="24" font-weight="700" fill="#0f172a">Facade — Job Lifecycle 과 Credit 정합성</text>

  <!-- 통합 요약 박스 -->
  <g>
    <rect x="60" y="78" width="1380" height="84" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="80" y="106" font-size="13" fill="#334155">Facade 가 Parse job lifecycle 을 책임지고, 결과에 따라 Credit 을 confirm / cancel</text>
    <text x="80" y="140" font-size="13" fill="#334155">결과별 흐름 — <tspan font-weight="700" fill="#15803d">성공 confirm</tspan> · <tspan font-weight="700" fill="#991b1b">실패 cancel</tspan> · 어느 단계에서 실패했는지 Facade 단계명 그대로 로그/메트릭에 남아 장애 식별이 단순</text>
  </g>

  <!-- Client -->
  <g>
    <rect x="60" y="180" width="180" height="84" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="1.3"/>
    <g color="#6366f1"><use href="#ico-client" x="78" y="198" width="22" height="22"/></g>
    <text x="106" y="216" font-size="14" font-weight="700" fill="#312e81">Client</text>
    <text x="78" y="240" font-size="12" fill="#1f2937">Parse 요청</text>
    <text x="78" y="256" font-size="11.5" fill="#64748b">파일 · 옵션 · API Key</text>
  </g>

  <!-- Facade big box -->
  <g>
    <rect x="280" y="180" width="980" height="320" rx="14" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.8"/>
    <g color="#06b6d4"><use href="#ico-flow" x="300" y="198" width="26" height="26"/></g>
    <text x="334" y="219" font-size="20" font-weight="700" fill="#0e7490">Facade — Job Lifecycle 제어</text>
    <text x="302" y="244" font-size="12.5" fill="#155e75">prepare → preInfer → infer → afterInfer · Credit / Storage / Model 호출을 한자리에서 제어</text>

    <!-- ① prepare -->
    <g>
      <rect x="302" y="260" width="224" height="220" rx="9" fill="#ffffff" stroke="#67e8f9"/>
      <g color="#06b6d4"><use href="#ico-prep" x="316" y="274" width="18" height="18"/></g>
      <text x="340" y="288" font-size="14" font-weight="700" fill="#0e7490">① prepare</text>
      <text x="316" y="312" font-size="12" fill="#1f2937">API Key 검증</text>
      <text x="316" y="330" font-size="12" fill="#1f2937">job 메타데이터 생성</text>
      <text x="316" y="348" font-size="12" fill="#1f2937">입력 옵션 정규화</text>
      <text x="316" y="376" font-size="12" fill="#1f2937">예상 비용 산출</text>
      <text x="316" y="394" font-size="12" fill="#1f2937">Credit 예약 (hold)</text>
      <text x="316" y="422" font-size="11.5" fill="#64748b">잔액 부족 시 즉시 거부</text>
      <text x="316" y="442" font-size="11.5" fill="#64748b">이후 단계는 진입하지 않음</text>
      <text x="316" y="462" font-size="11.5" fill="#64748b">동시 요청도 같은 lock 으로 관리</text>
    </g>

    <!-- ② preInfer -->
    <g>
      <rect x="540" y="260" width="224" height="220" rx="9" fill="#ffffff" stroke="#67e8f9"/>
      <g color="#06b6d4"><use href="#ico-down" x="554" y="274" width="18" height="18"/></g>
      <text x="578" y="288" font-size="14" font-weight="700" fill="#0e7490">② preInfer</text>
      <text x="554" y="312" font-size="12" fill="#1f2937">파일 다운로드 (Storage)</text>
      <text x="554" y="330" font-size="12" fill="#1f2937">전처리 / 페이지 분할</text>
      <text x="554" y="348" font-size="12" fill="#1f2937">프롬프트 구성</text>
      <text x="554" y="376" font-size="12" fill="#1f2937">profile 별 Prompt 적용</text>
      <text x="554" y="394" font-size="12" fill="#1f2937">SaaS: 기본 · On-Prem: site</text>
      <text x="554" y="422" font-size="11.5" fill="#64748b">실패 시 cancel 경로로</text>
      <text x="554" y="442" font-size="11.5" fill="#64748b">진입 (infer 하지 않음)</text>
    </g>

    <!-- ③ infer -->
    <g>
      <rect x="778" y="260" width="224" height="220" rx="9" fill="#ffffff" stroke="#67e8f9"/>
      <g color="#06b6d4"><use href="#ico-brain" x="792" y="274" width="18" height="18"/></g>
      <text x="816" y="288" font-size="14" font-weight="700" fill="#0e7490">③ infer</text>
      <text x="792" y="312" font-size="12" fill="#1f2937">Model Provider 호출</text>
      <text x="792" y="330" font-size="12" fill="#1f2937">Gemini · vLLM (profile 별)</text>
      <text x="792" y="348" font-size="12" fill="#1f2937">결과 수집 · 검증</text>
      <text x="792" y="376" font-size="12" fill="#1f2937">실패 / 타임아웃 식별</text>
      <text x="792" y="394" font-size="12" fill="#1f2937">재시도 정책 적용</text>
      <text x="792" y="422" font-size="11.5" fill="#64748b">실패가 명확하면</text>
      <text x="792" y="442" font-size="11.5" fill="#64748b">즉시 cancel 경로로</text>
    </g>

    <!-- ④ afterInfer -->
    <g>
      <rect x="1016" y="260" width="224" height="220" rx="9" fill="#ffffff" stroke="#67e8f9"/>
      <g color="#06b6d4"><use href="#ico-save" x="1030" y="274" width="18" height="18"/></g>
      <text x="1054" y="288" font-size="14" font-weight="700" fill="#0e7490">④ afterInfer</text>
      <text x="1030" y="312" font-size="12" fill="#1f2937">결과 정형화</text>
      <text x="1030" y="330" font-size="12" fill="#1f2937">Storage 에 결과 저장</text>
      <text x="1030" y="348" font-size="12" fill="#1f2937">Usage 기록</text>
      <text x="1030" y="376" font-size="12" fill="#1f2937">성공 → credit.confirm()</text>
      <text x="1030" y="394" font-size="12" fill="#1f2937">실패 → credit.cancel()</text>
      <text x="1030" y="422" font-size="11.5" fill="#64748b">job 종료 시 결과 응답</text>
      <text x="1030" y="442" font-size="11.5" fill="#64748b">또는 async 콜백</text>
    </g>

    <!-- 단계 간 화살표 -->
    <line x1="526" y1="370" x2="538" y2="370" stroke="#475569" stroke-width="1.6" marker-end="url(#f-ar)"/>
    <line x1="764" y1="370" x2="776" y2="370" stroke="#475569" stroke-width="1.6" marker-end="url(#f-ar)"/>
    <line x1="1002" y1="370" x2="1014" y2="370" stroke="#475569" stroke-width="1.6" marker-end="url(#f-ar)"/>
  </g>

  <!-- Client → Facade -->
  <line x1="240" y1="222" x2="278" y2="222" stroke="#475569" stroke-width="1.6" marker-end="url(#f-ar)"/>

  <!-- Credit / Account (좌하) -->
  <g>
    <rect x="60" y="560" width="540" height="200" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.4"/>
    <g color="#f59e0b"><use href="#ico-credit" x="80" y="578" width="24" height="24"/></g>
    <text x="114" y="598" font-size="18" font-weight="700" fill="#92400e">Account · Credit · Usage</text>

    <!-- ① reserve (선차감) -->
    <g>
      <rect x="82" y="616" width="496" height="40" rx="8" fill="#ffffff" stroke="#fcd34d"/>
      <text x="98" y="641" font-size="13" font-weight="700" fill="#92400e">① reserve — 선차감</text>
      <text x="232" y="641" font-size="12" fill="#1f2937">prepare 단계에서 예상 비용만큼 잔액에서 미리 예약 차감</text>
    </g>

    <g>
      <rect x="82" y="666" width="240" height="84" rx="9" fill="#ffffff" stroke="#fcd34d"/>
      <g color="#16a34a"><use href="#ico-check" x="96" y="680" width="18" height="18"/></g>
      <text x="120" y="694" font-size="13" font-weight="700" fill="#15803d">② credit.confirm()</text>
      <text x="96" y="716" font-size="11.5" fill="#1f2937">선차감 → 실제 차감 확정</text>
      <text x="96" y="734" font-size="11" fill="#64748b">파싱 성공 시</text>
    </g>

    <g>
      <rect x="338" y="666" width="240" height="84" rx="9" fill="#ffffff" stroke="#fcd34d"/>
      <g color="#dc2626"><use href="#ico-cancel" x="352" y="680" width="18" height="18"/></g>
      <text x="376" y="694" font-size="13" font-weight="700" fill="#991b1b">③ credit.cancel()</text>
      <text x="352" y="716" font-size="11.5" fill="#1f2937">선차감 해제 → 잔액 복원</text>
      <text x="352" y="734" font-size="11" fill="#64748b">파싱 실패 / 중단 시</text>
    </g>
  </g>

  <!-- Storage + Model Provider (우하) -->
  <g>
    <rect x="640" y="560" width="800" height="200" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.3"/>
    <text x="660" y="588" font-size="16" font-weight="700" fill="#0f172a">Facade 가 부르는 외부 컴포넌트</text>

    <g>
      <rect x="660" y="604" width="240" height="136" rx="9" fill="#ffffff" stroke="#94a3b8"/>
      <text x="676" y="628" font-size="13" font-weight="700" fill="#334155">Storage</text>
      <text x="676" y="650" font-size="11.5" fill="#1f2937">원본 다운로드 (preInfer)</text>
      <text x="676" y="668" font-size="11.5" fill="#1f2937">결과 저장 (afterInfer)</text>
      <text x="676" y="690" font-size="11" fill="#64748b">MinIO 기반 Object Storage</text>
      <text x="676" y="708" font-size="11" fill="#64748b">캐시 / 작업 상태 Redis</text>
    </g>

    <g>
      <rect x="920" y="604" width="240" height="136" rx="9" fill="#ffffff" stroke="#94a3b8"/>
      <text x="936" y="628" font-size="13" font-weight="700" fill="#334155">Model Provider</text>
      <text x="936" y="650" font-size="11.5" fill="#1f2937">상용 · 자체 호스팅 (vLLM)</text>
      <text x="936" y="668" font-size="11.5" fill="#1f2937">profile 로 선택</text>
      <text x="936" y="690" font-size="11" fill="#64748b">실패 분류로 재시도 / 중단</text>
      <text x="936" y="708" font-size="11" fill="#64748b">결과 검증 후 다음 단계로</text>
    </g>

    <g>
      <rect x="1180" y="604" width="240" height="136" rx="9" fill="#ffffff" stroke="#94a3b8"/>
      <text x="1196" y="628" font-size="13" font-weight="700" fill="#334155">Prompt</text>
      <text x="1196" y="650" font-size="11.5" fill="#1f2937">SaaS: 공통 기본 prompt</text>
      <text x="1196" y="668" font-size="11.5" fill="#1f2937">On-Prem: site + opt inject</text>
      <text x="1196" y="690" font-size="11" fill="#64748b">preInfer 단계에서 조립</text>
      <text x="1196" y="708" font-size="11" fill="#64748b">profile 로 전략 주입</text>
    </g>
  </g>

  <!-- Facade → Credit / 외부 컴포넌트 화살표 -->
  <line x1="414" y1="500" x2="414" y2="558" stroke="#475569" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#f-ar)"/>
  <text x="422" y="536" font-size="11" fill="#475569">reserve · confirm · cancel</text>

  <line x1="1130" y1="500" x2="1130" y2="558" stroke="#475569" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#f-ar)"/>
  <text x="1138" y="536" font-size="11" fill="#475569">Storage · Model · Prompt</text>
</svg>
