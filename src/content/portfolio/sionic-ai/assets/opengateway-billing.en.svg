<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 320" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', 'Pretendard', sans-serif">
  <defs>
    <marker id="bl-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="bl-open" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M1,1 L10,6 L1,11" fill="none" stroke="#475569" stroke-width="1.3"/>
    </marker>
  </defs>

  <rect width="1480" height="320" fill="#fbfcfd"/>

  <!-- Title -->
  <text x="60" y="40"><tspan font-size="25" font-weight="700" fill="#0f172a">Core design — Billing pipeline</tspan><tspan font-size="14" fill="#64748b" dx="14">Call history is recorded in real time; a scheduler converts cost via the price table and deducts balance</tspan></text>

  <!-- ===== Price table banner (2-col width) ===== -->
  <rect x="60" y="64" width="860" height="60" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="84" y="89" font-size="15" font-weight="700" fill="#b45309">ModelPriceProvider — loads price table once at boot</text>
  <text x="84" y="112" font-size="12.5" fill="#1f2937">Official LiteLLM price table + override for new models without official pricing</text>

  <!-- section label -->
  <text x="60" y="156" font-size="15" font-weight="700" fill="#334155">Record (real time) · Billing (batch)</text>

  <!-- (1) record (realtime) -->
  <rect x="60" y="172" width="380" height="128" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/>
  <text x="84" y="200" font-size="14" font-weight="700" fill="#3730a3">1 Record — real time</text>
  <text x="416" y="200" font-size="11.5" font-family="ui-monospace, monospace" fill="#64748b" text-anchor="end">model_call_record</text>
  <line x1="76" y1="212" x2="424" y2="212" stroke="#c7d2fe" stroke-width="1"/>
  <text x="84" y="240" font-size="13" fill="#1f2937">Receives call history from Data Plane</text>
  <text x="84" y="268" font-size="13" fill="#1f2937">→ store (PENDING)</text>

  <line x1="440" y1="236" x2="468" y2="236" stroke="#475569" stroke-width="1.5" marker-end="url(#bl-ar)"/>

  <!-- (2) billing — BillingScheduler -->
  <rect x="470" y="172" width="450" height="128" rx="10" fill="#f0fdf4" stroke="#10b981" stroke-width="1.6"/>
  <text x="494" y="200" font-size="14" font-weight="700" fill="#047857">2 Billing — BillingScheduler</text>
  <text x="900" y="200" font-size="11.5" font-family="ui-monospace, monospace" fill="#64748b" text-anchor="end">model_call_cost</text>
  <line x1="486" y1="212" x2="904" y2="212" stroke="#a7f3d0" stroke-width="1"/>
  <text x="494" y="238" font-size="12.5" fill="#1f2937">Collects PENDING in chunks of N and matches prices</text>
  <text x="494" y="262" font-size="12.5" fill="#1f2937">Match 1:1 → CostRule cost calc → deduct balance → PROCESSED</text>
  <text x="494" y="286" font-size="12.5" fill="#be123c">Unmatched → ERROR_UNMATCHED · $0 · warning log</text>

  <!-- price table -> billing reference -->
  <line x1="690" y1="124" x2="690" y2="170" stroke="#475569" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#bl-open)"/>
  <text x="702" y="152" font-size="11" font-style="italic" fill="#64748b">price ref</text>

  <line x1="920" y1="236" x2="948" y2="236" stroke="#475569" stroke-width="1.5" marker-end="url(#bl-ar)"/>

  <!-- (3) outcome block -->
  <rect x="950" y="64" width="470" height="236" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.4"/>
  <text x="974" y="90" font-size="14" font-weight="700" fill="#334155">Billing result · balance management</text>

  <rect x="970" y="108" width="430" height="52" rx="9" fill="#ffffff" stroke="#10b981" stroke-width="1.4"/>
  <text x="990" y="131" font-size="13" font-weight="700" fill="#047857">Balance deduction</text>
  <text x="990" y="150" font-size="11.5" fill="#1f2937">Deduct Account · balance ≤ 0 → suspend API Key</text>

  <rect x="970" y="172" width="430" height="52" rx="9" fill="#ffffff" stroke="#f59e0b" stroke-width="1.4"/>
  <text x="990" y="195" font-size="13" font-weight="700" fill="#b45309">Low-balance alert</text>
  <text x="990" y="214" font-size="11.5" fill="#1f2937">Emails team owner when threshold reached</text>

  <rect x="970" y="236" width="430" height="52" rx="9" fill="#ffffff" stroke="#6366f1" stroke-width="1.4"/>
  <text x="990" y="259" font-size="13" font-weight="700" fill="#3730a3">Top-up</text>
  <text x="990" y="278" font-size="11.5" fill="#1f2937">Stripe · PayPal · Redeem Code</text>
</svg>
