<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title description">
  <title id="title">Rate Limits의 preflight와 postflight</title>
  <desc id="description">기존 오버뷰를 확장한 요청 경로. Gateway의 preflight는 하나의 Redis Lua로 RPM과 TPM의 TAT를 판정하고, 허용 시 RPM TAT만 전진한다. Model Provider가 성공 응답과 실제 usage를 반환하면 Gateway의 postflight가 TPM TAT를 전진한다. Local Cache에는 Team Tier Policy가 있고 GCRA State는 Gateway 밖의 Redis에 있다.</desc>
